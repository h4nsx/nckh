# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11s with Dual-Scale SS2D (Case C: P4 + P5 Selective State Space Aggregation)
# Architectural Ablation: ABL-02
# Evaluates symmetric 2D Selective State Space sequence modeling at both:
# - Stage P4 (Layer 7): Stride 16, 256 channels, 40x40 spatial resolution (mid-scale warehouse targets)
# - Stage P5 (Layer 11): Stride 32, 512 channels, 20x20 spatial resolution (room-scale global context)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11s_ss2d_p4_p5.yaml' will pick scales 's'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (512 * width_mult=0.5 -> 256 channels)
  - [-1, 1, WarehouseSS2DBlock, [256, 256, 16, 3, 0.5]] # 7-P4 SS2D context aggregator (256 channels, 40x40)
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9 (1024 * width_mult=0.5 -> 512 channels)
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 1, WarehouseSS2DBlock, [512, 512, 16, 3, 0.5]] # 11-P5 SS2D context aggregator (512 channels, 20x20)

# YOLO11s head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (upsample P5 from 20x20 -> 40x40)
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4 SS2D output (Layer 7)
  - [-1, 2, C3k2, [512, False]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (upsample from 40x40 -> 80x80)
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3 (Layer 4)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small detection feature map)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4 (Layer 14)
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium detection feature map)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 cat backbone P5 SS2D output (Layer 11)
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large detection feature map)

  - [[17, 20, 23], 1, Detect, [nc]] # 24 Detect(P3, P4, P5)
